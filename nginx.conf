server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Spielsammlungen (lokal): Volume-Mount. no-cache nur fuer die Entwicklung;
    # im Release besser weglassen, damit ETag-Caching greift.
    location /games/ {
        add_header Cache-Control "no-cache";
        gzip on;
        gzip_types application/json;
    }

    # SPA-Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
